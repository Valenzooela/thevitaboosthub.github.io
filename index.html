<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yanira Rios - The Vita Boost Hub</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(160deg, #f5f0e1 0%, #eef1e4 45%, #16382a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card-container {
            background: #fffdf7;
            border-radius: 18px;
            box-shadow: 0 20px 60px rgba(15, 46, 33, 0.35);
            max-width: 420px;
            width: 100%;
            overflow: hidden;
            animation: slideUp 0.6s ease-out;
            border: 1px solid rgba(201, 162, 39, 0.35);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            background: linear-gradient(135deg, #0f2e21 0%, #1c4d36 55%, #2f6b46 100%);
            padding: 44px 30px 36px;
            text-align: center;
            color: #fdf8e8;
            position: relative;
        }

        .header::after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 4px;
            background: linear-gradient(90deg, #c9a227, #f1d97a, #c9a227);
        }

        .avatar {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #2f6b46, #143b28);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 18px;
            font-size: 42px;
            border: 3px solid #d4af37;
            box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.2);
        }

        .name {
            font-size: 27px;
            font-weight: 700;
            margin-bottom: 6px;
            letter-spacing: 0.3px;
        }

        .title {
            font-size: 15px;
            opacity: 0.95;
            font-weight: 500;
            letter-spacing: 0.5px;
            color: #f1d97a;
        }

        .company {
            font-size: 14px;
            opacity: 0.9;
            margin-top: 6px;
            letter-spacing: 0.5px;
        }

        .tagline {
            margin-top: 16px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #fdf8e8;
        }

        .content {
            padding: 34px 30px 8px;
        }

        .pillars {
            display: flex;
            justify-content: space-between;
            padding: 0 30px 28px;
            gap: 8px;
        }

        .pillar {
            flex: 1;
            text-align: center;
        }

        .pillar-icon {
            width: 48px;
            height: 48px;
            margin: 0 auto 8px;
            border-radius: 50%;
            border: 1.5px solid #c9a227;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            background: #f8f3e1;
        }

        .pillar-label {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            color: #1c4d36;
        }

        .info-section {
            margin-bottom: 28px;
        }

        .info-label {
            font-size: 12px;
            text-transform: uppercase;
            color: #a9842d;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }

        .info-item {
            display: flex;
            align-items: center;
            margin-bottom: 14px;
            text-decoration: none;
            color: #22422f;
            transition: all 0.3s ease;
        }

        .info-item:hover {
            color: #1c4d36;
            transform: translateX(4px);
        }

        .info-icon {
            width: 24px;
            height: 24px;
            margin-right: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .info-text {
            flex: 1;
            font-size: 14px;
            line-height: 1.4;
        }

        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(201, 162, 39, 0.5), transparent);
            margin: 24px 0;
        }

        .cta-buttons {
            display: flex;
            gap: 12px;
            margin-top: 4px;
        }

        .btn {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #1c4d36;
            border-radius: 8px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #1c4d36 0%, #2f6b46 100%);
            color: #fdf8e8;
            border-color: transparent;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(28, 77, 54, 0.4);
        }

        .btn-secondary {
            background: #fffdf7;
            color: #a9842d;
            border-color: #c9a227;
        }

        .btn-secondary:hover {
            background: #f8f3e1;
            transform: translateY(-2px);
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-top: 24px;
        }

        .social-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #f2ede0;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: #1c4d36;
            font-size: 18px;
            transition: all 0.3s ease;
            border: 1px solid rgba(201, 162, 39, 0.4);
        }

        .social-icon:hover {
            background: #1c4d36;
            color: #f1d97a;
            transform: scale(1.1);
        }

        .footer {
            text-align: center;
            padding: 20px;
            background: #f2ede0;
            font-size: 11px;
            color: #6b6045;
            letter-spacing: 0.3px;
        }

        @media (max-width: 480px) {
            .header {
                padding: 34px 20px 30px;
            }

            .content {
                padding: 28px 20px 8px;
            }

            .pillars {
                padding: 0 16px 24px;
            }

            .name {
                font-size: 23px;
            }

            .cta-buttons {
                flex-direction: column;
            }
        }
    </style>
</head>
